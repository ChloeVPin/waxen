name: waxen
description: Diagnose why macOS would block an app, disk image, or installer package
author: ChloeVPin
branding:
  icon: search
  color: purple

inputs:
  path:
    description: Path to a .app bundle, .dmg, or .pkg
    required: true
  binary:
    description: Path to a waxen executable. When empty, use PATH or build from the action source.
    required: false
    default: ""
  json:
    description: Write a machine-readable JSON report
    required: false
    default: "true"
  report-path:
    description: File to write the report to
    required: false
    default: waxen-report.json
  fail-on-blocker:
    description: Fail the job when waxen finds a confirmed launch blocker
    required: false
    default: "true"
  fail-on-error:
    description: Fail the job on usage, missing-target, or tool errors
    required: false
    default: "true"

outputs:
  exit-code:
    description: waxen process exit code
    value: ${{ steps.diagnose.outputs.exit-code }}
  launch-status:
    description: clean, blocked, or inconclusive when the report is JSON
    value: ${{ steps.diagnose.outputs.launch-status }}
  verdict:
    description: trusted, cautious, unsigned, tampered, broken, or unknown
    value: ${{ steps.diagnose.outputs.verdict }}
  report-path:
    description: Path to the written report
    value: ${{ steps.diagnose.outputs.report-path }}

runs:
  using: composite
  steps:
    - id: diagnose
      shell: bash
      env:
        WAXEN_PATH: ${{ inputs.path }}
        WAXEN_BIN: ${{ inputs.binary }}
        WAXEN_JSON: ${{ inputs.json }}
        WAXEN_REPORT_PATH: ${{ inputs.report-path }}
        WAXEN_FAIL_ON_BLOCKER: ${{ inputs.fail-on-blocker }}
        WAXEN_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        WAXEN_INSTALL: "true"
      run: bash "${{ github.action_path }}/action/diagnose.sh"
