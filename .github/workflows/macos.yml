name: macOS validation

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift
        run: swift --version
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Validate schema and emitted report
        shell: bash
        run: |
          python3 -m json.tool Schemas/diagnosis-v1.json >/dev/null
          swift build -c release
          bash Scripts/test-schema.sh /tmp/waxen-schema
      - name: Generate fixtures
        run: bash Scripts/make-fixtures.sh /tmp/waxen-fixtures
      - name: Real macOS integration fixtures
        run: bash Scripts/integration-macos.sh /tmp/waxen-real-integration
      - name: Diagnose fixture (expected unsigned blocker)
        shell: bash
        run: |
          set +e
          .build/release/waxen diagnose /tmp/waxen-fixtures/Valid.app --json > /tmp/waxen-valid.json
          status=$?
          set -e
          test "$status" -eq 1
          python3 - <<'PY'
          import json
          with open('/tmp/waxen-valid.json') as handle:
              report = json.load(handle)
          assert report['launchStatus'] == 'blocked'
          assert any(item['id'] in ('signature.unsigned', 'signature.invalid') for item in report['findings'])
          PY
      - name: Diagnose disk image fixture (expected unsigned blocker)
        shell: bash
        run: |
          if [ ! -f /tmp/waxen-fixtures/Valid.dmg ]; then
            echo "Valid.dmg was not generated"
            exit 1
          fi
          set +e
          .build/release/waxen diagnose /tmp/waxen-fixtures/Valid.dmg --json > /tmp/waxen-valid-dmg.json
          status=$?
          set -e
          test "$status" -eq 1
          python3 - <<'PY'
          import json
          with open('/tmp/waxen-valid-dmg.json') as handle:
              report = json.load(handle)
          assert report['target']['kind'] == 'disk_image'
          assert report['container']['available'] is True
          assert report['container']['nestedApplicationPath']
          assert report['launchStatus'] == 'blocked'
          ids = [item['id'] for item in report['findings']]
          assert 'container.app-found' in ids
          assert any(item in ('signature.unsigned', 'signature.invalid') for item in ids)
          PY
      - name: Diagnose installer package fixture (expected unsigned blocker)
        shell: bash
        run: |
          if [ ! -f /tmp/waxen-fixtures/Valid.pkg ]; then
            echo "Valid.pkg was not generated"
            exit 1
          fi
          set +e
          .build/release/waxen diagnose /tmp/waxen-fixtures/Valid.pkg --json > /tmp/waxen-valid-pkg.json
          status=$?
          set -e
          test "$status" -eq 1
          python3 - <<'PY'
          import json
          with open('/tmp/waxen-valid-pkg.json') as handle:
              report = json.load(handle)
          assert report['target']['kind'] == 'installer_package'
          assert report['container']['available'] is True
          assert report['container']['nestedApplicationPath']
          assert report['launchStatus'] == 'blocked'
          ids = [item['id'] for item in report['findings']]
          assert 'container.app-found' in ids
          assert any(item in ('signature.unsigned', 'signature.invalid') for item in ids)
          PY
      - name: Action wrapper tests
        run: bash Scripts/test-action.sh
      - name: Action on unsigned fixture (expect blocker)
        id: blocked
        continue-on-error: true
        uses: ./
        with:
          path: /tmp/waxen-fixtures/Valid.app
          binary: ${{ github.workspace }}/.build/release/waxen
          report-path: /tmp/waxen-action-valid.json
          fail-on-blocker: true
      - name: Assert action failed on blocker
        run: |
          test "${{ steps.blocked.outcome }}" = "failure"
          test "${{ steps.blocked.outputs.exit-code }}" = "1"
          test "${{ steps.blocked.outputs.launch-status }}" = "blocked"
          python3 - <<'PY'
          import json
          report = json.load(open("/tmp/waxen-action-valid.json"))
          assert report["launchStatus"] == "blocked"
          assert any(item["id"] in ("signature.unsigned", "signature.invalid") for item in report["findings"])
          PY
      - name: Action records blocker without failing the job
        id: recorded
        uses: ./
        with:
          path: /tmp/waxen-fixtures/Valid.app
          binary: ${{ github.workspace }}/.build/release/waxen
          report-path: /tmp/waxen-action-valid-nofail.json
          fail-on-blocker: false
      - name: Assert action output without job failure
        run: |
          test "${{ steps.recorded.outputs.exit-code }}" = "1"
          test "${{ steps.recorded.outputs.launch-status }}" = "blocked"
